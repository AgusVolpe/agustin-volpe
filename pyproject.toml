[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sistema-planta"
version = "0.1.0"
description = "Sistema agéntico para la Planta de Inyección PIA-3 (Academia Novit 2026)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "paho-mqtt>=2.1.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "psycopg[binary]>=3.1.18",
    "pgvector>=0.3.0",
    "sqlalchemy>=2.0.30",
    "mcp>=1.0.0",
    "faster-whisper>=1.0.3",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
